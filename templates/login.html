{% extends "base.html" %}
{% block title %}Login — Network Log Analyzer{% endblock %}
{% block content %}
<div class="login-wrapper">
  <div class="card shadow-sm" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">
      <h4 class="mb-3 text-center">Sign in</h4>
      <p class="text-muted small text-center">Demo credentials: <code>admin/admin123</code> or <code>analyst/analyst123</code></p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('dashboard') }}" class="small text-muted">Skip login (demo mode) &rarr;</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
